name: Auto Commit and Push (sano branch)

on:
  schedule:
    # Runs daily at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch: {} # allows manual run from GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: sano                # ✅ your branch name
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect & commit changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi
          git commit -m "🤖 Auto commit on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin sano

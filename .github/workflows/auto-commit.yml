name: Auto Push Daily

on:
  schedule:
    - cron: '30 13 * * *'   # 7:30 PM IST (13:30 UTC)
  workflow_dispatch:        # allows manual run for testing

jobs:
  auto-push:
    runs-on: ubuntu-latest

    steps:
      # 1\ufe0f\u20e3 Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: sano

      # 2\ufe0f\u20e3 Configure Git
      - name: Configure Git
        run: |
          git config user.name "santhoshkrishnant"
          git config user.email "your_email@example.com"

      # 3\ufe0f\u20e3 Stage workflow and gitignore files automatically
      - name: Stage workflow and .gitignore
        run: |
          git add .github/workflows/auto-commit.yml
          git add .gitignore
          git add .

      # 4\ufe0f\u20e3 Generate dynamic commit message starting from Day8
      - name: Generate commit message
        id: commitmsg
        run: |
          # If your last commit Day number was Day7, start from Day8
          LAST_DAY=7
          TODAY=$(date +%s)
          DAY_COUNT=$(( LAST_DAY + 1 ))
          DATE_STR=$(date +"%d %b")
          echo "message=Day${DAY_COUNT} (${DATE_STR})" >> $GITHUB_OUTPUT

      # 5\ufe0f\u20e3 Commit & push only if there are changes
      - name: Commit and push changes
        run: |
          git diff --cached --quiet && echo "\u2705 No changes to commit" && exit 0
          git commit -m "Auto commit: ${{ steps.commitmsg.outputs.message }}"
          git push https://$GITHUB_ACTOR:${{ secrets.GH_PAT }}@github.com/santhoshkrishnant/Angular_Course_Practice_code.git sano

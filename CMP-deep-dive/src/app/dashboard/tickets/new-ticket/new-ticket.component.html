<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Tilte">
    <input name="title" id="title"  #input [(ngModel)]="enterTitle"/>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3"  #input [(ngModel)]="enterText"></textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon"> → </span>
    </button>
  </p>
</form>
